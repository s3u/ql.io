AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: ql.io Serverless Deployment

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Deployment environment

Globals:
  Function:
    Runtime: nodejs18.x
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        NODE_ENV: !Ref Environment

Resources:
  # Lambda Function
  QLIOFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'qlio-${Environment}'
      CodeUri: lambda/
      Handler: index.handler
      Environment:
        Variables:
          CACHE_TABLE: !Ref CacheTable
          CONFIG_BUCKET: !Ref ConfigBucket
          ENVIRONMENT: !Ref Environment
      Events:
        QueryApi:
          Type: Api
          Properties:
            Path: /query
            Method: post
            Auth:
              ApiKeyRequired: true
        TablesApi:
          Type: Api
          Properties:
            Path: /tables
            Method: get
            Auth:
              ApiKeyRequired: true
        ProxyApi:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: any
            Auth:
              ApiKeyRequired: true
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CacheTable
        - S3ReadPolicy:
            BucketName: !Ref ConfigBucket

  # DynamoDB Cache Table
  CacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'qlio-cache-${Environment}'
      AttributeDefinitions:
        - AttributeName: queryHash
          AttributeType: S
      KeySchema:
        - AttributeName: queryHash
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # S3 Config Bucket
  ConfigBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'qlio-config-${AWS::AccountId}-${Environment}'
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # S3 Console Bucket (simplified for demo)
  ConsoleBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'qlio-console-${AWS::AccountId}-${Environment}'
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: error.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  # Console Bucket Policy (simplified)
  ConsoleBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ConsoleBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub 'arn:aws:s3:::${ConsoleBucket}/*'

  # CloudFront Distribution (simplified)
  ConsoleDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Origins:
          - Id: S3Origin
            DomainName: !Sub '${ConsoleBucket}.s3-website-${AWS::Region}.amazonaws.com'
            CustomOriginConfig:
              HTTPPort: 80
              OriginProtocolPolicy: http-only
        Enabled: true
        DefaultRootObject: index.html
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
        PriceClass: PriceClass_100
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

  # API Key
  ApiKey:
    Type: AWS::ApiGateway::ApiKey
    Properties:
      Name: !Sub 'qlio-api-key-${Environment}'
      Description: API Key for ql.io serverless deployment
      Enabled: true

  # Usage Plan
  UsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    Properties:
      UsagePlanName: !Sub 'qlio-usage-plan-${Environment}'
      Description: Usage plan for ql.io API
      Throttle:
        RateLimit: 1000
        BurstLimit: 2000
      Quota:
        Limit: 100000
        Period: MONTH
      ApiStages:
        - ApiId: !Ref ServerlessRestApi
          Stage: !Ref ServerlessRestApiProdStage

  # Usage Plan Key
  UsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref ApiKey
      KeyType: API_KEY
      UsagePlanId: !Ref UsagePlan

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod'
    Export:
      Name: !Sub '${AWS::StackName}-ApiUrl'

  ConsoleUrl:
    Description: CloudFront console URL
    Value: !Sub 'https://${ConsoleDistribution.DomainName}'
    Export:
      Name: !Sub '${AWS::StackName}-ConsoleUrl'

  ApiKeyId:
    Description: API Key ID
    Value: !Ref ApiKey
    Export:
      Name: !Sub '${AWS::StackName}-ApiKeyId'

  ConfigBucket:
    Description: S3 Config Bucket Name
    Value: !Ref ConfigBucket
    Export:
      Name: !Sub '${AWS::StackName}-ConfigBucket'

  ConsoleBucket:
    Description: S3 Console Bucket Name
    Value: !Ref ConsoleBucket
    Export:
      Name: !Sub '${AWS::StackName}-ConsoleBucket'