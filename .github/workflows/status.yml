name: Status

on:
  push:
    branches: [ master, main ]
  schedule:
    # Run daily at 2 AM UTC to catch any external API issues
    - cron: '0 2 * * *'

jobs:
  health-check:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Quick health check
      run: |
        make install
        npm run test:demo
        echo "✅ ql.io is healthy and all integration tests pass!"
    
    - name: Update status
      if: success()
      run: |
        echo "Status: All systems operational" > status.txt
        echo "Last checked: $(date)" >> status.txt
        echo "Tests passing: 690+" >> status.txt