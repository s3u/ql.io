name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: |
        make install
    
    - name: Run all module tests
      run: |
        npm test
    
    - name: Run integration tests
      run: |
        npm run test:demo
    
    - name: Run performance benchmarks (Node 20 only)
      if: matrix.node-version == '20.x'
      run: |
        npm run test:performance
      continue-on-error: true
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-node-${{ matrix.node-version }}
        path: |
          coverage/
          test-results.xml
        retention-days: 7

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run ESLint
      run: |
        npx eslint . --ext .js --config config/.eslintrc.json --ignore-pattern node_modules/ --ignore-pattern modules/*/node_modules/
      continue-on-error: true

  security:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run security audit
      run: |
        npm audit --audit-level=moderate
      continue-on-error: true

  build-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: make install
    
    - name: Test server startup
      run: |
        timeout 30s npm start &
        sleep 10
        curl -f http://localhost:3000/tables || exit 1
        curl -f http://localhost:3001 || exit 1
      continue-on-error: true
    
    - name: Test demo functionality
      run: |
        # Test that demos are accessible
        timeout 30s npm start &
        sleep 10
        curl -f "http://localhost:3000/" || exit 1
        curl -f "http://localhost:3000/demos" || exit 1
      continue-on-error: true